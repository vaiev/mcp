name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecomputer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the SSH client dependency
        run: python -m pip install paramiko
      - name: Run sidecomputer tests
        run: python3 sidecomputer/tests/test_sidecomputer.py
